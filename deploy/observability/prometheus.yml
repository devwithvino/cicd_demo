# Prometheus scrape config for the local docker compose stack.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shipyard
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels: { service: api }
      - targets: ["worker:8081"]
        labels: { service: worker }
      - targets: ["web:8082"]
        labels: { service: web }
