# Reusable notification: post a clear summary to Slack.
# Statuses: success, failure, cancelled, rollback and approval (a deploy is
# waiting for a reviewer). Skips quietly when no webhook is configured, so
# forks never fail on it.
name: _notify

on:
  workflow_call:
    inputs:
      status:
        description: success, failure, cancelled, rollback or approval
        required: true
        type: string
      title:
        required: true
        type: string
      summary:
        description: One or two sentences in plain language
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      environment:
        required: false
        type: string
        default: ""
      link:
        description: Link to the live app or a related page
        required: false
        type: string
        default: ""
      link_label:
        description: Button text for the link
        required: false
        type: string
        default: Live app
      fields:
        description: 'Extra fields as JSON, for example [{"name":"Lead time","value":"9m"}]'
        required: false
        type: string
        default: "[]"
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

permissions: {}

jobs:
  slack:
    name: notify slack
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Send message
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ inputs.status }}
          TITLE: ${{ inputs.title }}
          SUMMARY: ${{ inputs.summary }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          LINK: ${{ inputs.link }}
          LINK_LABEL: ${{ inputs.link_label }}
          FIELDS: ${{ inputs.fields }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping."
            exit 0
          fi
          case "${STATUS}" in
            success)   color="#2EB67D"; icon="✅"; run_label="View run" ;;
            rollback)  color="#ECB22E"; icon="↩️"; run_label="View run" ;;
            approval)  color="#ECB22E"; icon="⏳"; run_label="Review and approve" ;;
            cancelled) color="#9E9E9E"; icon="⏹️"; run_label="View run" ;;
            *)         color="#E01E5A"; icon="❌"; run_label="View run" ;;
          esac
          payload=$(jq -n \
            --arg title "${icon} ${TITLE}" --arg summary "${SUMMARY}" --arg color "${color}" \
            --arg version "${VERSION}" --arg env "${ENVIRONMENT}" --arg link "${LINK}" --arg link_label "${LINK_LABEL}" \
            --arg run "${RUN_URL}" --arg run_label "${run_label}" --arg commit "${COMMIT:0:7}" \
            --arg commit_url "${COMMIT_URL}" --arg actor "${ACTOR}" --arg repo "${REPO}" \
            --argjson extra "${FIELDS}" '
            def field($name; $value): {type: "mrkdwn", text: "*\($name)*\n\($value)"};
            {
              text: $title,
              attachments: [{
                color: $color,
                blocks: (
                  [
                    {type: "header", text: {type: "plain_text", text: ($title | .[0:150]), emoji: true}},
                    {type: "section", text: {type: "mrkdwn", text: $summary}},
                    {type: "section", fields: ((
                      [ (if $env != "" then field("Environment"; $env) else empty end),
                        (if $version != "" then field("Version"; $version) else empty end),
                        field("Commit"; "<\($commit_url)|\($commit)>"),
                        field("Triggered by"; $actor) ]
                      + [ $extra[] | field(.name; .value) ]
                    ) | .[0:10])},
                    {type: "actions", elements: (
                      [ {type: "button", text: {type: "plain_text", text: $run_label}, url: $run, style: "primary"} ]
                      + (if $link != "" then [ {type: "button", text: {type: "plain_text", text: $link_label}, url: $link} ] else [] end)
                    )},
                    {type: "context", elements: [ {type: "mrkdwn", text: "Shipyard pipeline · \($repo)"} ]}
                  ]
                )
              }]
            }')
          curl -fsS -X POST -H "Content-Type: application/json" -d "${payload}" "${WEBHOOK}"
          echo "Notification sent."
