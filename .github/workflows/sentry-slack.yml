# Sentry to Slack, for free. Sentry's free plan has no Slack integration, so
# this workflow checks Sentry every 30 minutes and posts issues first seen in
# staging or production since its previous successful run. Pull requests that
# touch it run a self test that checks API access without posting anything.
name: sentry-slack

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Optional start time to backfill from (UTC, for example 2026-10-10T08:00:00)
        required: false
        default: ""
  pull_request:
    paths:
      - "scripts/sentry_check.py"
      - ".github/workflows/sentry-slack.yml"

permissions: {}

concurrency:
  group: sentry-slack
  cancel-in-progress: false

env:
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}

jobs:
  digest:
    name: new Sentry issues
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      count: ${{ steps.digest.outputs.count }}
      summary: ${{ steps.digest.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Self test (pull requests)
        if: github.event_name == 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 scripts/sentry_check.py check

      - name: Find new issues since the last run
        id: digest
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_ORG_URL: https://${{ vars.SENTRY_ORG }}.sentry.io
          SINCE_INPUT: ${{ inputs.since }}
        run: |
          # Start where the previous successful poll started, so nothing is
          # missed or posted twice. Pull request self tests are not polls.
          # A manual run can backfill from a chosen time instead.
          since="${SINCE_INPUT}"
          if [ -z "${since}" ]; then
            since=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sentry-slack.yml/runs?status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].run_started_at // empty' | sed 's/Z$//')
          fi
          if [ -z "${since}" ]; then since=$(date -u -d '35 minutes ago' +%Y-%m-%dT%H:%M:%S); fi
          python3 scripts/sentry_check.py digest --since "${since}" --out digest.json
          count=$(jq .count digest.json)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          summary=$(jq -r '.issues[:8][] | "• *\(.environment)* <\(.link)|\(.title)> (\(.count) events, release \(.release))"' digest.json)
          [ "${count}" -gt 8 ] && summary="${summary}"$'\n'"…and $(( count - 8 )) more in <${SENTRY_ORG_URL}/issues/|Sentry>."
          {
            echo "summary<<SUMMARY_EOF"
            echo "${summary}"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "### ${count} new Sentry issue(s) since ${since}" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify
    needs: digest
    if: needs.digest.outputs.count != '' && needs.digest.outputs.count != '0'
    uses: ./.github/workflows/_notify.yml
    with:
      status: failure
      title: "${{ needs.digest.outputs.count }} new error(s) in Sentry"
      summary: ${{ needs.digest.outputs.summary }}
      link: https://${{ vars.SENTRY_ORG }}.sentry.io/issues/
      link_label: Open Sentry
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
