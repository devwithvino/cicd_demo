# Phase 0 spike: prove a multi-arch image can be built in Actions, pushed to GHCR
# and deployed to Render by digest. This workflow is deleted after the spike.
name: spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["spike/**", ".github/workflows/spike.yml"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: spike/hello
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=0.0.0-spike
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shipyard-hello:spike
            ghcr.io/${{ github.repository_owner }}/shipyard-hello:sha-${{ github.sha }}
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "### Spike image pushed"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`ghcr.io/${OWNER}/shipyard-hello\` |"
            echo "| Digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
