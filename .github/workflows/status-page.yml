# Status page: regenerate DORA metrics and deployment history from real
# pipeline data and publish them to GitHub Pages. Runs after every deploy
# related workflow and every 6 hours. Publishing uses OIDC through
# actions/deploy-pages, so no deploy token is stored anywhere.
name: status-page

on:
  # zizmor: ignore[dangerous-triggers] The triggering workflows only run on
  # main or by manual dispatch, never for pull requests, and the build job
  # below double checks that. Artifacts are parsed as JSON data, never run.
  workflow_run:
    workflows: [deliver, demo-failure, rollback, deploy-manual]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "status-site/**"
      - "scripts/dora_metrics.py"
      - ".github/workflows/status-page.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  build:
    name: Generate metrics
    # Only act on runs from this repository that were not pull requests.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute DORA metrics from pipeline history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/dora_metrics.py --repo "${GITHUB_REPOSITORY}" \
            --config status-site/config.json --out status-site/data/metrics.json
          jq -r '.dora | "| Deployment frequency | \(.deploymentFrequency.perWeek) per week (\(.deploymentFrequency.rating)) |",
            "| Lead time (median) | \(.leadTime.medianSeconds)s (\(.leadTime.rating)) |",
            "| Change failure rate | \(.changeFailureRate.rate) (\(.changeFailureRate.rating)) |",
            "| Time to restore (median) | \(.timeToRestore.medianSeconds)s (\(.timeToRestore.rating)) |"' \
            status-site/data/metrics.json > rows.md
          {
            echo "### DORA metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            cat rows.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: status-site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
