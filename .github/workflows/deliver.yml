# The main delivery path: every merge to main is versioned, built once and
# promoted by digest through staging and, after a human approval, production.
#
#   version -> build once -> staging (deploy + smoke) -> approval -> production
#   (same digests + smoke) -> release (retag, GitHub Release) -> report + notify
name: deliver

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "status-site/**"
      - "scripts/dora_metrics.py"
      - ".github/workflows/status-page.yml"
  workflow_dispatch:

permissions: {}

# One delivery at a time. A running delivery is never cancelled midway.
concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  version:
    name: Calculate version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          version=$(python3 scripts/next_version.py)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Release version: ${version}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build once
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      extra_tags: main

  staging:
    name: Staging
    needs: [version, build]
    permissions:
      contents: read
      packages: write
      issues: write
      attestations: read
    uses: ./.github/workflows/_deploy-render.yml
    with:
      environment: staging
      digests: ${{ needs.build.outputs.digests }}
      registry: ${{ needs.build.outputs.registry }}
      version: ${{ needs.version.outputs.version }}
      git_sha: ${{ github.sha }}
    # Only this one secret name is passed. Its value comes from the GitHub
    # environment of the deploy job, not from the repository.
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  # The production environment requires a reviewer, so this job waits for a
  # human approval. It deploys the identical digests that passed staging.
  production:
    name: Production
    needs: [version, build, staging]
    permissions:
      contents: read
      packages: write
      issues: write
      attestations: read
    uses: ./.github/workflows/_deploy-render.yml
    with:
      environment: production
      digests: ${{ needs.build.outputs.digests }}
      registry: ${{ needs.build.outputs.registry }}
      version: ${{ needs.version.outputs.version }}
      git_sha: ${{ github.sha }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  release:
    name: Release
    needs: [version, build, production]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      # The built in token may not tag a commit whose workflow files differ
      # from main, which happens when main moves on while a release waits for
      # approval. A GitHub App token is short lived, scoped to this repository
      # and allowed to do it. Without the App the built in token is used.
      # A broken App setup must not block a release that already passed
      # production, so this falls back to the built in token with a warning.
      - name: Mint a short lived release token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Warn when the App token is unavailable
        if: vars.RELEASE_APP_CLIENT_ID != '' && steps.app-token.outcome == 'failure'
        run: echo "::warning title=Release token::The GitHub App token could not be minted. Check the App installation and RELEASE_APP_PRIVATE_KEY. Falling back to the built in token."

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag released digests with the version (no rebuild)
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          DIGESTS: ${{ needs.build.outputs.digests }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for svc in $(echo "${DIGESTS}" | jq -r 'keys[]'); do
            digest=$(echo "${DIGESTS}" | jq -r --arg s "${svc}" '.[$s]')
            docker buildx imagetools create \
              -t "${REGISTRY}-${svc}:${VERSION}" -t "${REGISTRY}-${svc}:latest" \
              "${REGISTRY}-${svc}@${digest}"
          done

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ needs.build.outputs.registry }}
          DIGESTS: ${{ needs.build.outputs.digests }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Images"
            echo ""
            echo "The exact digests below passed staging and production smoke tests."
            echo ""
            echo "| Service | Image |"
            echo "|---|---|"
            for svc in $(echo "${DIGESTS}" | jq -r 'keys[]'); do
              echo "| ${svc} | \`${REGISTRY}-${svc}@$(echo "${DIGESTS}" | jq -r --arg s "${svc}" '.[$s]')\` |"
            done
          } > notes.md
          {
            echo ""
            echo "## Supply chain"
            echo ""
            echo "Every image is signed with cosign (keyless, GitHub OIDC) and carries SLSA build provenance"
            echo "and an SPDX SBOM as attestations. The SBOM files are attached below. Verify an image with:"
            echo ""
            echo '```'
            echo "gh attestation verify oci://${REGISTRY}-api@$(echo "${DIGESTS}" | jq -r .api) --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> notes.md
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "v${VERSION}" --notes-file notes.md --generate-notes sboms/*.spdx.json

  report:
    name: Report
    if: always()
    needs: [version, build, staging, production, release]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      summary: ${{ steps.report.outputs.summary }}
      fields: ${{ steps.report.outputs.fields }}
    steps:
      - name: Measure lead time and outcome
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RESULTS: ${{ toJSON(needs) }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          status=success
          for job in build staging production release; do
            result=$(echo "${RESULTS}" | jq -r --arg j "${job}" '.[$j].result')
            if [ "${result}" != "success" ]; then status=failure; failed="${failed:-${job}}"; fi
          done
          if [ "$(echo "${RESULTS}" | jq -r '.production.result')" = "cancelled" ]; then status=cancelled; fi
          rolled_env=""
          for env in staging production; do
            if [ "$(echo "${RESULTS}" | jq -r --arg e "${env}" '.[$e].outputs.result // empty')" = "rolled_back" ]; then
              rolled_env="${env}"
              restore=$(echo "${RESULTS}" | jq -r --arg e "${env}" '.[$e].outputs.restore_seconds')
              checks=$(echo "${RESULTS}" | jq -r --arg e "${env}" '.[$e].outputs.failed_checks')
              incident=$(echo "${RESULTS}" | jq -r --arg e "${env}" '.[$e].outputs.incident_url')
            fi
          done
          [ -n "${rolled_env}" ] && status=rollback

          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs')
          start=$(date -d "${COMMIT_TIME:-$(echo "${jobs}" | jq -r 'map(.started_at) | min')}" +%s)
          now=$(date +%s)
          # Time spent waiting for the human approval is not pipeline time. While
          # a job waits on an environment gate it has no steps, so the wait runs
          # from job creation until its first step starts.
          prod=$(echo "${jobs}" | jq -c '[.[] | select(.name | startswith("Production"))][0] // {}')
          prod_created=$(echo "${prod}" | jq -r '.created_at // empty')
          prod_first_step=$(echo "${prod}" | jq -r '.steps[0].started_at // empty')
          wait=0
          if [ -n "${prod_created}" ] && [ -n "${prod_first_step}" ]; then
            wait=$(( $(date -d "${prod_first_step}" +%s) - $(date -d "${prod_created}" +%s) ))
          elif [ -n "${prod_created}" ] && [ "$(echo "${prod}" | jq -r '.conclusion')" = "failure" ]; then
            # A production job that failed without running a step was not approved.
            status=cancelled
          fi
          lead=$(( now - start - wait ))
          fmt() { printf '%dm %02ds' $(( $1 / 60 )) $(( $1 % 60 )); }

          if [ "${status}" = "success" ]; then
            summary="Version ${VERSION} is live in production. Built once, verified in staging, approved, and promoted by digest with no manual steps."
          elif [ "${status}" = "rollback" ]; then
            summary="Version ${VERSION} failed verification in ${rolled_env} (${checks}) and was rolled back automatically. Service was restored in ${restore}s. Incident: ${incident}"
          elif [ "${status}" = "cancelled" ]; then
            summary="Version ${VERSION} was not promoted to production. The approval was declined or the run was cancelled. Production is unchanged."
          else
            summary="Version ${VERSION} did not reach production. The ${failed} stage failed, so nothing unverified was released."
          fi
          fields=$(jq -cn --arg lead "$(fmt "${lead}")" --arg wait "$(fmt "${wait}")" \
            '[{name: "Pipeline time", value: $lead, inline: true}, {name: "Approval wait", value: $wait, inline: true}]')
          {
            echo "status=${status}"
            echo "summary=${summary}"
            echo "fields=${fields}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Delivery ${status}"
            echo ""
            echo "${summary}"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Commit to production, excluding approval wait | $(fmt "${lead}") |"
            echo "| Time waiting for approval | $(fmt "${wait}") |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify
    if: always()
    needs: [version, report]
    uses: ./.github/workflows/_notify.yml
    with:
      status: ${{ needs.report.outputs.status }}
      title: "Delivery ${{ needs.report.outputs.status }}: v${{ needs.version.outputs.version }}"
      summary: ${{ needs.report.outputs.summary }}
      version: ${{ needs.version.outputs.version }}
      environment: production
      link: https://shipyard-web-production.onrender.com
      fields: ${{ needs.report.outputs.fields }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
