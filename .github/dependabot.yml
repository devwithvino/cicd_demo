# Dependabot keeps every dependency current: Go modules, Python (uv), npm,
# container base images, compose images and the pinned GitHub Actions.
#
# - Minor and patch updates are grouped into one pull request per ecosystem
#   to keep the noise low. Major updates arrive on their own for review.
# - A seven day cooldown skips brand new releases, a cheap defence
#   against compromised packages, which are usually caught within a week.
# - Commit messages follow Conventional Commits, so the PR title check passes
#   and versioning stays correct.
# Patch and minor updates merge on their own once every check passes
# (see .github/workflows/dependabot-automerge.yml).
version: 2

updates:
  - package-ecosystem: gomod
    directory: /services/api
    schedule: { interval: weekly, day: monday, time: "06:00" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /services/worker
    schedule: { interval: weekly, day: monday, time: "06:00" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /services/web
    schedule: { interval: weekly, day: monday, time: "06:00" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: docker
    directories: [/services/api, /services/worker, /services/web]
    schedule: { interval: weekly, day: monday, time: "06:00" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      base-images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      compose-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00" }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
