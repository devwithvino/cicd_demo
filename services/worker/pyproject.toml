[project]
name = "shipyard-worker"
version = "0.0.0"
description = "Shipyard background worker: consumes jobs from Key Value"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "redis>=5.2",
    "prometheus-client>=0.21",
    "sentry-sdk>=2.71",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipyard_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=shipyard_worker --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
